<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Torque comparison for perpendicular and angled forces</title>
  <desc id="desc">Two equal-radius levers use equal forces. A perpendicular force produces eight newton-metres of torque, while a force at sixty degrees produces six point nine three newton-metres.</desc>
  <defs>
    <marker id="radius-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c7fb8"/></marker>
    <marker id="force-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d95f0e"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#fbfaf7"/>
  <text class="heading" x="600" y="38" text-anchor="middle">The angle changes the torque magnitude</text>
  <path class="divider" d="M600 65V565"/>

  <g aria-label="Perpendicular force example">
    <text class="panel-title" x="300" y="82" text-anchor="middle">Perpendicular force</text>
    <circle class="orbit" cx="270" cy="275" r="185"/>
    <circle class="axis-ring" cx="270" cy="275" r="27"/>
    <circle class="axis-dot" cx="270" cy="275" r="7"/>
    <text class="purple label" x="270" y="324" text-anchor="middle">⊙ τ</text>
    <path class="radius" d="M270 275H455" marker-end="url(#radius-arrow)"/>
    <text class="blue label" x="352" y="252">r = 0.20 m</text>
    <circle class="point" cx="455" cy="275" r="6"/>
    <path class="force" d="M455 275V82" marker-end="url(#force-arrow)"/>
    <text class="orange label" x="474" y="135">F = 40 N</text>
    <path class="angle" d="M510 275A55 55 0 0 0 455 220"/>
    <path class="extension" d="M455 275H525"/>
    <text class="green label" x="496" y="215">θ = 90°</text>
    <rect class="formula-box" x="44" y="475" width="512" height="76" rx="12"/>
    <text class="formula" x="300" y="522" text-anchor="middle">τ = (40 N)(0.20 m) sin 90° = 8.00 N·m</text>
  </g>

  <g aria-label="Sixty-degree force example">
    <text class="panel-title" x="900" y="82" text-anchor="middle">Angled force</text>
    <circle class="orbit" cx="860" cy="275" r="185"/>
    <circle class="axis-ring" cx="860" cy="275" r="27"/>
    <circle class="axis-dot" cx="860" cy="275" r="7"/>
    <text class="purple label" x="860" y="324" text-anchor="middle">⊙ τ</text>
    <path class="radius" d="M860 275H1045" marker-end="url(#radius-arrow)"/>
    <text class="blue label" x="938" y="252">r = 0.20 m</text>
    <circle class="point" cx="1045" cy="275" r="6"/>
    <path class="force" d="M1045 275L1142 107" marker-end="url(#force-arrow)"/>
    <text class="orange label" x="1087" y="173" transform="rotate(-60 1087 173)">F = 40 N</text>
    <path class="angle" d="M1100 275A55 55 0 0 0 1072.5 227.4"/>
    <path class="extension" d="M1045 275H1115"/>
    <text class="green label" x="1093" y="222">θ = 60°</text>
    <rect class="formula-box" x="644" y="475" width="512" height="76" rx="12"/>
    <text class="formula" x="900" y="522" text-anchor="middle">τ = (40 N)(0.20 m) sin 60° = 6.93 N·m</text>
  </g>

  <style>
    text{fill:#222;font-family:Arial,Helvetica,sans-serif;font-size:20px}.heading{font-size:25px;font-weight:700}.panel-title{font-size:23px;font-weight:700}.label{font-size:19px;font-weight:600}.formula{font-size:21px;font-weight:700}
    .blue{fill:#2c7fb8}.orange{fill:#d95f0e}.green{fill:#2ca25f}.purple{fill:#7b3294}
    .divider{stroke:#d7d3cc;stroke-width:2}.orbit{fill:none;stroke:#aaa;stroke-width:2;stroke-dasharray:2 8}.radius{fill:none;stroke:#2c7fb8;stroke-width:5}.force{fill:none;stroke:#d95f0e;stroke-width:6}.angle{fill:none;stroke:#2ca25f;stroke-width:4}.extension{fill:none;stroke:#888;stroke-width:2;stroke-dasharray:7 6}
    .axis-ring{fill:#f3e8f6;stroke:#7b3294;stroke-width:3}.axis-dot{fill:#7b3294}.point{fill:#333}.formula-box{fill:#fff;stroke:#cbc7c0;stroke-width:2}
  </style>
</svg>
