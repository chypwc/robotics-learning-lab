<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" role="img" aria-labelledby="title desc">
  <title id="title">Geometric decomposition in Rodrigues' rotation formula</title>
  <desc id="desc">For the example rotation axis a w equal to e z, vector y is decomposed into a parallel component along the axis and a perpendicular component in a plane. The perpendicular component rotates through angle alpha, producing Q w y. The cross product a w cross y perpendicular is tangent to the rotation circle.</desc>
  <defs>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f8f6b"/></marker>
    <marker id="arrow-original" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#377fe5"/></marker>
    <marker id="arrow-parallel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d98218"/></marker>
    <marker id="arrow-perpendicular" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d98218"/></marker>
    <marker id="arrow-rotated" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8a5fc7"/></marker>
    <marker id="arrow-tangent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d35f9f"/></marker>
    <marker id="arrow-angle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#555"/></marker>
  </defs>

  <rect width="840" height="500" fill="#fbfaf7"/>

  <ellipse class="rotation-plane" cx="400" cy="225" rx="250" ry="75"/>
  <path class="rotation-arc" d="M646 212A250 75 0 0 0 357 151" marker-end="url(#arrow-angle)"/>
  <path class="angle-arc" d="M479 220A80 28 0 0 0 386 197" marker-end="url(#arrow-angle)"/>

  <path class="axis-guide" d="M400 454L400 45"/>
  <path class="axis" d="M400 430L400 55" marker-end="url(#arrow-axis)"/>
  <path class="parallel" d="M400 430L400 225" marker-end="url(#arrow-parallel)"/>
  <path class="perpendicular" d="M400 225L646 212" marker-end="url(#arrow-perpendicular)"/>
  <path class="rotated-perpendicular" d="M400 225L357 151" marker-end="url(#arrow-rotated)"/>
  <path class="original" d="M400 430L646 212" marker-end="url(#arrow-original)"/>
  <path class="rotated" d="M400 430L357 151" marker-end="url(#arrow-rotated)"/>
  <path class="tangent" d="M646 212L583 104" marker-end="url(#arrow-tangent)"/>

  <path class="right-angle" d="M400 239L414 238L414 224"/>

  <circle class="origin" cx="400" cy="430" r="5"/>
  <circle class="projection" cx="400" cy="225" r="5"/>
  <circle class="point-original" cx="646" cy="212" r="6"/>
  <circle class="point-rotated" cx="357" cy="151" r="6"/>

  <text x="377" y="460">O</text>
  <text x="374" y="213">C</text>
  <text x="658" y="222">P</text>
  <text x="318" y="141">P′</text>

  <text class="axis-label" x="418" y="70"><tspan class="vector-symbol">a</tspan><tspan baseline-shift="sub">w</tspan> = <tspan class="vector-symbol">e</tspan><tspan baseline-shift="sub">z</tspan></text>
  <text class="parallel-label" x="414" y="344"><tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">∥</tspan></text>
  <text class="perpendicular-label" x="505" y="195"><tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">⊥</tspan></text>
  <text class="original-label" x="529" y="348"><tspan class="vector-symbol">y</tspan> = <tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">∥</tspan> + <tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">⊥</tspan></text>
  <text class="rotated-perpendicular-label" x="274" y="206">rotated <tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">⊥</tspan></text>
  <text class="rotated-label" x="249" y="314"><tspan class="vector-symbol">Q</tspan><tspan baseline-shift="sub">w</tspan><tspan class="vector-symbol">y</tspan></text>
  <text class="tangent-label" x="594" y="91"><tspan class="vector-symbol">a</tspan><tspan baseline-shift="sub">w</tspan> × <tspan class="vector-symbol">y</tspan><tspan baseline-shift="sub">⊥</tspan></text>
  <text class="angle-label" x="438" y="185">α</text>
  <text class="plane-label" x="515" y="292">plane perpendicular to <tspan class="vector-symbol">a</tspan><tspan baseline-shift="sub">w</tspan></text>

  <style>
    text{fill:#222;font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:400}
    .rotation-plane{fill:#eef4f2;fill-opacity:.7;stroke:#aeb3b7;stroke-width:1.6;stroke-dasharray:7 7}
    .rotation-arc{fill:none;stroke:#777;stroke-width:1.8;stroke-dasharray:5 5}
    .angle-arc{fill:none;stroke:#555;stroke-width:1.8}
    .axis-guide{fill:none;stroke:#aeb3b7;stroke-width:1.5;stroke-dasharray:6 6}
    .axis{fill:none;stroke:#2f8f6b;stroke-width:3.2}
    .parallel,.perpendicular{fill:none;stroke:#d98218;stroke-width:3.8}
    .original{fill:none;stroke:#377fe5;stroke-width:3.8}
    .rotated,.rotated-perpendicular{fill:none;stroke:#8a5fc7;stroke-width:3.8}
    .tangent{fill:none;stroke:#d35f9f;stroke-width:3.5}
    .right-angle{fill:none;stroke:#555;stroke-width:1.6}
    .origin,.projection{fill:#333}
    .point-original{fill:#377fe5}
    .point-rotated{fill:#8a5fc7}
    .vector-symbol{font-weight:700;font-style:italic}
    .axis-label{fill:#236e53}
    .parallel-label,.perpendicular-label{fill:#a95f10}
    .original-label{fill:#2868bd}
    .rotated-label,.rotated-perpendicular-label{fill:#6f46a7}
    .tangent-label{fill:#a83e7b}
    .axis-label,.parallel-label,.perpendicular-label,.original-label,.rotated-label,.rotated-perpendicular-label,.tangent-label,.angle-label{font-style:italic;paint-order:stroke;stroke:#fbfaf7;stroke-width:4;stroke-linejoin:round}
    .plane-label{fill:#666;font-size:15px}
  </style>
</svg>
