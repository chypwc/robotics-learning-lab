<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" role="img" aria-labelledby="title desc">
  <title id="title">Vector geometry of torque</title>
  <desc id="desc">A position vector rho extends from origin O to force application point P. A force F acts at sixty degrees to the position-vector direction. The perpendicular moment arm L reaches the force line of action, and torque points out of the page.</desc>
  <defs>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c7fb8"/></marker>
    <marker id="orange-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#d95f0e"/></marker>
    <marker id="green-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0L0 5L10 10Z" fill="#2ca25f"/></marker>
    <marker id="green-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2ca25f"/></marker>
  </defs>
  <rect width="850" height="560" fill="#fbfaf7"/>
  <text class="heading" x="425" y="42" text-anchor="middle">Torque from a force applied away from an axis</text>

  <path class="line-action" d="M420 530L690 62"/>
  <path class="callout" d="M616 351L548 336"/>
  <text class="small" x="624" y="360">line of action of F</text>

  <path class="radius" d="M150 270H570" marker-end="url(#blue-arrow)"/>
  <text class="blue label" x="350" y="248">position vector ρ</text>
  <circle class="point" cx="570" cy="270" r="7"/>
  <text class="label" x="578" y="296">P</text>

  <path class="force" d="M570 270L690 62" marker-end="url(#orange-arrow)"/>
  <text class="orange label" x="678" y="142">force F</text>

  <path class="angle" d="M625 270A55 55 0 0 0 597.5 222.4"/>
  <text class="green label" x="626" y="220">θ</text>
  <path class="extension" d="M570 270H650"/>

  <path class="moment-arm" d="M150 270L465 452" marker-start="url(#green-start)" marker-end="url(#green-end)"/>
  <path class="right-angle" d="M473 438L459 430L451 444"/>
  <circle class="foot" cx="465" cy="452" r="5"/>
  <text class="green label" x="292" y="388" transform="rotate(30 292 388)">moment arm L = ρ sin θ</text>

  <circle class="axis-ring" cx="150" cy="270" r="27"/>
  <circle class="axis-dot" cx="150" cy="270" r="7"/>
  <text class="label" x="137" y="315">O</text>
  <text class="purple label" x="54" y="205">τ<tspan baseline-shift="sub">O</tspan> = ρ × F</text>
  <text class="purple small" x="48" y="231">out of the page</text>

  <rect class="formula-box" x="520" y="414" width="282" height="104" rx="12"/>
  <text class="formula" x="661" y="454" text-anchor="middle">τ = ρF sin θ</text>
  <text class="formula" x="661" y="493" text-anchor="middle">τ = FL</text>

  <style>
    text{fill:#222;font-family:Arial,Helvetica,sans-serif;font-size:22px}
    .heading{font-size:25px;font-weight:700}.label{font-size:22px;font-weight:600}.small{font-size:18px}.formula{font-size:27px;font-weight:700}
    .blue{fill:#2c7fb8}.orange{fill:#d95f0e}.green{fill:#2ca25f}.purple{fill:#7b3294}
    .radius{fill:none;stroke:#2c7fb8;stroke-width:5}.force{fill:none;stroke:#d95f0e;stroke-width:6}.angle{fill:none;stroke:#2ca25f;stroke-width:4}.extension{fill:none;stroke:#888;stroke-width:2;stroke-dasharray:7 6}
    .line-action{fill:none;stroke:#777;stroke-width:2;stroke-dasharray:8 7}.callout{fill:none;stroke:#777;stroke-width:1.5}.moment-arm{fill:none;stroke:#2ca25f;stroke-width:3}.right-angle{fill:none;stroke:#2ca25f;stroke-width:3}
    .point,.foot{fill:#333}.axis-ring{fill:#f3e8f6;stroke:#7b3294;stroke-width:3}.axis-dot{fill:#7b3294}
    .formula-box{fill:#fff;stroke:#cbc7c0;stroke-width:2}
  </style>
</svg>
