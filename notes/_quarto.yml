project:
  type: book
  output-dir: ../output/book

book:
  title: "Foundations of Autonomous Robotics"
  subtitle: "Mathematics, Physics, Algorithms, and Engineering"
  chapters:
    - index.qmd
    - notation.qmd
    - part: "Part I - Motion, Mechanics, and Control"
      chapters:
        - 01_linear_algebra_foundations.qmd
        - 02_geometry_and_coordinate_frames.qmd
        - 03_kinematics_and_numerical_integration.qmd
        - 04_geometry_and_motion_implementation.qmd
        - 05_ros2_packages_and_development_workflow.qmd

lang: en-AU

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    toc: true

number-sections: true
