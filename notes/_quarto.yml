project:
  type: book
  output-dir: ../output/book

book:
  title: "Foundations of Autonomous Robotics"
  navbar:
    search: true
    respect-user-color-scheme: true
  subtitle: "Mathematics, Physics, Algorithms, and Engineering"
  chapters:
    - index.qmd
    - notation.qmd
    - part: "Part I - Motion, Mechanics, and Control"
      chapters:
        - 01_linear_algebra_foundations.qmd
        - 02_geometry_and_coordinate_frames.qmd
        - 03_kinematics_and_numerical_integration.qmd
        - 04_kinematics_and_numerical_integration_implementation.qmd
        - 05_ros2_packages_and_development_workflow.qmd
        - 06_planar_rigid_body_motion_se2_and_twists.qmd
        - 08_dynamics_forces_and_actuator_limits.qmd

lang: en-AU

format:
  html:
    theme:
      light: yeti
      dark: solar
    toc: true
    code-copy: true
  pdf:
    documentclass: scrreprt
    pdf-engine: lualatex
    toc: true
    geometry:
      - top=22mm
      - bottom=25mm
      - left=25mm
      - right=25mm

number-sections: true
